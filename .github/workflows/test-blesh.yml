name: Test blesh feature

on:
  push:
    paths:
      - src/blesh/**
      - test/blesh/**
      - .github/workflows/test-blesh.yml
  pull_request:
    paths:
      - src/blesh/**
      - test/blesh/**
      - .github/workflows/test-blesh.yml

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # base-images that do not support a latest tag can be updated to latest via the command
        #   update-workflow-image-tags
        base-image:
          # Debian-based
          - debian:latest
          - ubuntu:latest
          # Alpine
          - alpine:latest
          # RPM-based (dnf)
          - fedora:latest
          - quay.io/centos/centos:latest
          - oraclelinux:latest
          - rockylinux:latest
          - almalinux:latest
          # RPM-based (yum) - Amazon Linux uses yum/dnf
          - amazonlinux:latest
          # RPM-based (tdnf) - Azure Linux (has no 'latest' tag)
          - mcr.microsoft.com/azurelinux/base/core:3.0
          # Red Hat (dnf) - RHEL UBI (has no 'latest' tag)
          - registry.access.redhat.com/ubi10/ubi
          # openSUSE
          - opensuse/leap:latest
          # Arch
          - archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli

      - name: Test feature
        run: |
          devcontainer features test \
            --project-folder . \
            --features blesh \
            --base-image ${{ matrix.base-image }} \
            --log-level info
