name: Test blesh

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/blesh/**
      - test/blesh/**
      - .github/workflows/test-blesh.yml

jobs:
  test:
    name: blesh / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - config_rcfile
          - config_nightly_build_version
          - config_install_dir_and_bashrc
          - image_debian
          - image_ubuntu
          - image_alpine
          - image_fedora
          - image_centos
          - image_oracle
          - image_rocky
          - image_alma
          - image_amazon
          - image_azure
          - image_rhel
          - image_opensuse
          - image_arch

    steps:
      - uses: actions/checkout@v4

      # The config_rcfile scenario uses an absolute bind mount path matching the
      # devcontainer workspace layout. Symlink the checkout so that path resolves
      # on the Actions runner.
      - name: Symlink checkout to /workspaces/devcontainer-features
        run: sudo mkdir -p /workspaces && sudo ln -s "$GITHUB_WORKSPACE" /workspaces/devcontainer-features

      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli

      - name: Test scenario
        run: ./scripts/run-tests blesh ${{ matrix.scenario }}
